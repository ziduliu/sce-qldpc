random_seed: 43
max_iterations: 200
checkpoint_interval: 5
diff_based_evolution: true
max_code_length: 80000
early_stopping_patience: 9999
llm:
  api_base: https://api.openai.com/v1
  temperature: 0.8
  top_p: 0.95
  max_tokens: 65536
  timeout: 600
  retries: 4
  retry_delay: 10
  models:
  - name: gpt-6-luna
    weight: 1.0
    reasoning_effort: xhigh
database:
  population_size: 60
  num_islands: 3
  migration_interval: 25
  feature_dimensions:
  - rate_bin
  feature_bins:
    rate_bin: 10
  artifact_size_threshold: 131072
evaluator:
  timeout: 7200
  parallel_evaluations: 16
  cascade_evaluation: false
prompt:
  num_top_programs: 3
  num_diverse_programs: 2
  num_previous_programs: 3
  include_artifacts: true
  use_template_stochasticity: true
  template_variations:
    strategy_choice:
    - "Assignment level: L1 (LEVEL_1_ELEMENT_MODEL)\nTHIS ROUND: change the element model ONLY - NEW_CTX and CELL (which cells get how many terms, and which group elements). The group (GTYPE, A0, CUSTOM_GROUP) and the shapes (A_SHAPE, B_SHAPE) are FROZEN this round and must stay byte-for-byte identical. Nothing in the harness enforces this: a diff that touches them is still built and scored, but the number that comes back does not answer what this round asks. Everything about how a cell's support is chosen is fair game: shared state built once in NEW_CTX, constraints enforced by construction, cells of 1-5 distinct elements where the row-weight budget (HX row = A-row terms + B-column terms <= 12, HZ row = B-row terms + A-column terms <= 12) allows.\nRESPONSE ORDER: first the line \"CHANGES: <group|shapes|filling, comma-separated>\" naming exactly the layers this card allows you to change, then one line of reason, then, before any diff:\n  CONCEPT: <one falsifiable constructive principle naming the group, its order, and the A_SHAPE/B_SHAPE>\n  GROUP: <why this group and this order: which measured beds (readings in the table or in RUN STATE) or which algebraic fact (the rank bound, earlier readings on this or a related group) point to it; on a round that keeps the group, why it is kept>\n  SHAPES: <why (ra,ca)x(rb,cb) for the cell this round names: the guaranteed rate it gives, the lift order it allows, what the two sides' component codes look like (equal shapes give equal-length component codes on the X and Z sides), and which protograph blocks (Acol/Brow in the table) carried the parent's lightest logicals; on a round that keeps the shapes, why they are kept>\n  FILLING: <how the cells are filled and why: the element model / support profile, and which table facts it is meant to change (witness weights, their block locations, k above the bound)>\n  DIFFERS FROM PARENT: <what the built matrices will contain that the parent's do not>\nThe FIRST SEARCH/REPLACE hunk must rewrite CONCEPT, GROUP, SHAPES and FILLING (and FAMILY_NAME whenever the group, the shapes or the labeling rule changes) so that the program carries the reasons for its own group, shapes and filling; every later hunk implements them. A diff that reproduces the parent's matrices wastes the round: it is still built and scored, and returns a number already known (and its codes are archive duplicates that score nothing)."
    - "Assignment level: L2 (LEVEL_2_SHAPE)\nTHIS ROUND: change the protograph shapes - edit A_SHAPE and/or B_SHAPE (any ra, ca, rb, cb >= 1, single-row or single-column sides included), and, if the size law then needs a different order, the order itself: edit CUSTOM_GROUP's valid_q AND the parameters of custom_ops (for a metacyclic group m, r, s) so that the group really has the new order. Keep the group FAMILY (the construction rule; see GROUP FAMILY in the system message) - changing the rule is level 3. Repair NEW_CTX/CELL so every cell of the new shape is well defined, and keep n = (ca*cb + ra*rb) * q inside [100, 600). Recheck BOTH row sums against the cap of 12: an HX row holds ca + rb cells and an HZ row holds ra + cb cells. The rank-count bound k >= q*(ca-ra)*(cb-rb) tells you the guaranteed rate of the new shape; the SHAPES table in RUN STATE lists the admissible shapes with their largest lift order. Update CONCEPT, SHAPES, FILLING and FAMILY_NAME to describe the new shape and the reason for it.\n\nWHERE TO FILL: this run's goal is the whole FRONTIER (RUN STATE): the best program of EVERY rate cell, k/n from 0.10 to 0.55 in\nsteps of 0.05. Empty cells and cells whose best is far below the neighbouring cells are where a round can gain the most; the SHAPES table lists, per cell, the shapes whose rank-count bound lands there with the largest lift order the size window admits. Cells are the 10 centres k/n = 0.100, 0.150, ..., 0.550; the two\nend cells are open-ended (everything below 0.125 counts in the\nfirst, everything above 0.525 in the last); a program belongs to the cell whose centre is nearest to the mean k/n of its five measured codes (cell 0.200 spans 0.175-0.225). Each round NAMES the cell it is trying to fill (see THIS ROUND above). Write the CENTRE of the cell you are actually aiming at as the SECOND line of your reply, right after the CHANGES line: \"TARGET CELL: 0.200\" - normally the cell this round names; if you aim elsewhere, say why in your reason line. The round counts in the cell the program's measured codes actually land in, whichever you aimed at.\nRESPONSE ORDER: first the line \"CHANGES: <group|shapes|filling, comma-separated>\" naming exactly the layers this card allows you to change, then one line of reason, then, before any diff:\n  CONCEPT: <one falsifiable constructive principle naming the group, its order, and the A_SHAPE/B_SHAPE>\n  GROUP: <why this group and this order: which measured beds (readings in the table or in RUN STATE) or which algebraic fact (the rank bound, earlier readings on this or a related group) point to it; on a round that keeps the group, why it is kept>\n  SHAPES: <why (ra,ca)x(rb,cb) for the cell this round names: the guaranteed rate it gives, the lift order it allows, what the two sides' component codes look like (equal shapes give equal-length component codes on the X and Z sides), and which protograph blocks (Acol/Brow in the table) carried the parent's lightest logicals; on a round that keeps the shapes, why they are kept>\n  FILLING: <how the cells are filled and why: the element model / support profile, and which table facts it is meant to change (witness weights, their block locations, k above the bound)>\n  DIFFERS FROM PARENT: <what the built matrices will contain that the parent's do not>\nThe FIRST SEARCH/REPLACE hunk must rewrite CONCEPT, GROUP, SHAPES and FILLING (and FAMILY_NAME whenever the group, the shapes or the labeling rule changes) so that the program carries the reasons for its own group, shapes and filling; every later hunk implements them. A diff that reproduces the parent's matrices wastes the round: it is still built and scored, and returns a number already known (and its codes are archive duplicates that score nothing)."
    - "Assignment level: L3 (LEVEL_3_GROUP)\nTHIS ROUND: jump to a different group - rewrite CUSTOM_GROUP (set GTYPE = \"custom\"; valid_q(q) and custom_ops(q) defining elements, ident, mul, inv) and update FAMILY_NAME. The new group must be a genuinely different group from the parent's (not a relabeling); any finite group you can write down qualifies, abelian or not. You MAY also edit A_SHAPE/B_SHAPE and must repair NEW_CTX/CELL so every cell is well defined; the pair (order q, shapes) must satisfy n = (ca*cb + ra*rb)*q inside [100, 600). The scaffold validates identity, inverses and associativity before building and rejects a group whose admissible orders yield no valid n. Recheck both row-weight sums against the cap of 12. The BEDS list in RUN STATE shows every (group, shapes) bed this run has tried.\n\nWHERE TO FILL: this run's goal is the whole FRONTIER (RUN STATE): the best program of EVERY rate cell, k/n from 0.10 to 0.55 in\nsteps of 0.05. Empty cells and cells whose best is far below the neighbouring cells are where a round can gain the most; the SHAPES table lists, per cell, the shapes whose rank-count bound lands there with the largest lift order the size window admits. Cells are the 10 centres k/n = 0.100, 0.150, ..., 0.550; the two\nend cells are open-ended (everything below 0.125 counts in the\nfirst, everything above 0.525 in the last); a program belongs to the cell whose centre is nearest to the mean k/n of its five measured codes (cell 0.200 spans 0.175-0.225). Each round NAMES the cell it is trying to fill (see THIS ROUND above). Write the CENTRE of the cell you are actually aiming at as the SECOND line of your reply, right after the CHANGES line: \"TARGET CELL: 0.200\" - normally the cell this round names; if you aim elsewhere, say why in your reason line. The round counts in the cell the program's measured codes actually land in, whichever you aimed at.\nRESPONSE ORDER: first the line \"CHANGES: <group|shapes|filling, comma-separated>\" naming exactly the layers this card allows you to change, then one line of reason, then, before any diff:\n  CONCEPT: <one falsifiable constructive principle naming the group, its order, and the A_SHAPE/B_SHAPE>\n  GROUP: <why this group and this order: which measured beds (readings in the table or in RUN STATE) or which algebraic fact (the rank bound, earlier readings on this or a related group) point to it; on a round that keeps the group, why it is kept>\n  SHAPES: <why (ra,ca)x(rb,cb) for the cell this round names: the guaranteed rate it gives, the lift order it allows, what the two sides' component codes look like (equal shapes give equal-length component codes on the X and Z sides), and which protograph blocks (Acol/Brow in the table) carried the parent's lightest logicals; on a round that keeps the shapes, why they are kept>\n  FILLING: <how the cells are filled and why: the element model / support profile, and which table facts it is meant to change (witness weights, their block locations, k above the bound)>\n  DIFFERS FROM PARENT: <what the built matrices will contain that the parent's do not>\nThe FIRST SEARCH/REPLACE hunk must rewrite CONCEPT, GROUP, SHAPES and FILLING (and FAMILY_NAME whenever the group, the shapes or the labeling rule changes) so that the program carries the reasons for its own group, shapes and filling; every later hunk implements them. A diff that reproduces the parent's matrices wastes the round: it is still built and scored, and returns a number already known (and its codes are archive duplicates that score nothing)."
  system_message: "You are an expert in quantum error correction evolving lifted-product\n(LP) CSS codes over finite groups.\n\nPROGRAM FORMAT: a fixed scaffold plus ONE mutable EVOLVE block.\nFields: CONCEPT (one falsifiable design principle naming the group,\nits order and the shapes), GROUP (why this group and order), SHAPES\n(why these shapes for the cell), FILLING (how the cells are filled\nand why), FAMILY_NAME, GTYPE/A0/\nCUSTOM_GROUP (the group; custom groups define valid_q(q) and\ncustom_ops(q) and are validated before building), A_SHAPE (ra,ca),\nB_SHAPE (rb,cb), and two pure functions NEW_CTX(rng, G, idx) and\nCELL(rng, G, side, i, j, ctx) -> the full cell (i, j): a list of\n0..5 DISTINCT group elements (an empty list is a zero block). The\ngroup and the shapes are fixed for the WHOLE program; each slot\nidx = 0..N_SLOTS-1 (N_SLOTS is set by the harness, see the scaffold) fills the cells however it wants - term counts AND\nelements are both the slot's choice. Twenty deliberate designs, not\ntwenty draws: identical fillings are deduplicated and waste the\nslot - and \"identical\" means EQUIVALENT: codes whose Tanner\ngraphs are isomorphic (e.g. group-automorphism or permutation\nimages of one labeling) are deduplicated as one code, so orbit\ncopies of a single design waste their slots. A cell with duplicate\nelements voids its slot (duplicates cancel in F2[G]).\nroll_supports(rng) is a scaffold helper returning\na random weight-legal count grid for NEW_CTX to use or replace.\nNEW_CTX and CELL are ordinary Python: they may run any computation\nyou like when the program is built (generate many candidate fillings,\ncompute any property of them\nand keep only those that pass a criterion you\ndefine). Only the final cells of each slot are evaluated; the cost of\nthe computation is yours, the scaffold imposes no time limit below a\nfew minutes per program.\nEverything below the block is fixed scaffolding: do not edit it.\nSize law: n = (ca*cb + ra*rb) * q, n in [100, 600). Any shapes with\nra, ca, rb, cb >= 1 are admissible, single-row or single-column sides\nincluded; the rank-count bound below gives each shape's guaranteed\nk/n, and the SHAPES table in RUN STATE lists the admissible shapes\nwith their largest lift order under the size window.\n\nGOAL OF THIS RUN: raise the best program of EVERY rate cell of the\nFRONTIER (the MAP-Elites cells of this run: 10 cells centred at k/n = 0.100,\n0.150, ..., 0.550; a program belongs to the cell whose centre is\nNEAREST to the mean k/n of its five measured codes, so cell 0.200\nspans 0.175-0.225, and the two end cells are open-ended: cell\n0.100 takes every k/n below 0.125 and cell 0.550 every k/n above\n0.525), not one global best. Each round NAMES one cell it is asked to fill, drawn so that every cell gets the same share of the rounds; a cell can be named while it is still empty, and then the parent comes from the nearest cell that is not. A program's fitness is still computed as\ndescribed below, but it competes only inside the cell its measured codes\nland in (mean k/n of the top-5); an empty cell filled with a modest\nprogram is progress, a crowded cell topped by one more point is not.\n\nVERIFIED CONSTRUCTION HELPERS (scaffold, outside the EVOLVE block):\nlifted_matrices(G, cells_A, cells_B) returns exactly the HX / HZ the\nevaluator builds from those cells (same left/right lift conventions and\ncolumn order) as Python-int bit rows; gf2_rank(rows)\nis the rank behind k that the table reports; lifted_k(G,\nA, B) is the k the table will report; css_ok(hx, hz) checks HX HZ^T = 0.\nAny in-program screening should use these: a hand-written lift that gets\nthe left/right actions wrong screens a different (usually non-CSS) matrix\npair than the one that is measured.\n\nGROUP FAMILY, for the assignment cards: the construction rule of\nCUSTOM_GROUP (metacyclic Z_m x| Z_r, a direct product, a dihedral or\ndicyclic presentation, a matrix group, ...). Changing the parameters of\nthat rule (m, r, s, the order q) stays inside the family; changing the\nrule itself, or GTYPE, is a group change (level 3).\n\nTABLE FACTS reported for every distinct slot: k and k-kb (k above the\nrank-count bound), the row weight w, d2s and the proxy; for the measured\nslots also d30s and the family of minimum-weight logical operators the\n30 s search found (usually many, never provably all of them): how many per\ntype, how they split between the two LP sectors, which protograph blocks\nthey use, and the weight spectrum the search reached. These are\nmeasurements of the built matrices.\n\nSCORING (two tiers, both reported back to you):\n1. SCREEN: every distinct candidate gets a 2-second code-capacity\n   distance estimate d2s (an UPPER bound) and a proxy score\n   k*d2s^2/n. The proxy decides ONLY which candidates advance.\n2. MEASURE: the top-5 distinct candidates by proxy get a 30-second\n   code-capacity distance search d30s (the same search as d2s with\n   fifteen times the budget; the reported value is the smaller of\n   the two readings, still an UPPER bound on the code distance).\n   FITNESS = the sum of k*d30s^2/n over those five, divided by 5.\n   If fewer than five distinct candidates are measured, the\n   missing ones count as zero - one good code cannot earn a\n   five-code score.\nFacts: there is NO circuit-level tier in this run: the distance is\nthe code-capacity distance (min weight of a logical operator that\ncommutes with all checks of the opposite type), searched by a\nbudget-limited GPU method. Both d2s and d30s are upper bounds: a\nhigh reading means the search failed to find a lighter operator,\nnot that the code is deep; a 30 s search finds lighter operators\nthan a 2 s one on some codes, so d30s <= d2s.\n\nHARD RULES (checked PER SLOT; a violating slot is voided, not\nrepaired): max row weight <= 12 - an HX row sums A-row i with\nB-column j and an HZ row sums a B-row with an A-column; both sums\ncount the cells' term counts, so budget them when CELL decides its\nsizes. Every protograph row and column must keep at least one\nnonzero cell (all-zero rows/columns zero an entire lifted block and\nforce d=1). Cells hold 0..5 DISTINCT elements. k > 0 required.\nDo NOT generate isomorphic codes: two slots are the same code when\none is a relabeling of the other (a group automorphism, or any\npermutation of qubits and checks mapping one Tanner graph onto the\nother). Such slots are detected and collapsed to one - submitting\norbit or relabeled copies of one design wastes those slots.\nARCHIVE RULE: every code any earlier program produced (seeds and\nall shown programs included) is archived. A slot that reproduces\nan archived code - exactly or up to relabeling - is marked\ndup_archive in the table, is not measured, and scores nothing.\nCopying a shown program's element model therefore scores 0; only\ncodes that have never existed in this run count.\nEdit ONLY the EVOLVE block. Output exact SEARCH/REPLACE diffs;\nevery SEARCH must match the current program text exactly.\n\nVERIFIED ALGEBRA (facts, not advice): what always holds is\nk = n - rank_F2(HX) - rank_F2(HZ). With A of shape (ra, ca) and B\nof shape (rb, cb): n = q*(ca*cb + ra*rb), HX has q*ra*cb rows and\nHZ has q*ca*rb rows, so rank counting gives the GUARANTEED bound\n  k >= n - q*ra*cb - q*ca*rb = q*(ca-ra)*(cb-rb)\n(the signed product - informative when it is positive). Built k\noften exceeds the bound through rank deficits; the per-slot k in\nyour feedback is the measured truth.\n\nEach program in this prompt comes with a table showing every slot, its measured results, and the cells that produced those results. All programs are tested with the same evaluator, the same budget, and the same size range, so you can compare their results directly. Look at how the results vary across slots and between programs to understand how each program’s filling rule affects performance.\n\nEACH ROUND comes with an ASSIGNMENT card at the top of the message (drawn at random, each level equally likely): level 1 = element model only, level 2 = shapes, level 3 = group. Obey the card: change the layers it names, keep the others frozen. Declare what you change as the FIRST line of your reply (\"CHANGES: ...\"); what your diff actually changed is recorded and compared with the declaration and with the card.\n\nRESPONSE ORDER: first the CHANGES line and its one-line reason, then\nthe concept and its reasons, then the code derived from them - before any diff write -\n  CONCEPT: <the principle, naming the group, its order, the shapes>\n  GROUP: <why this group and order - the measured beds or algebraic facts that point to it>\n  SHAPES: <why these shapes for the named cell - guaranteed rate, lift order, the two sides'\n  component codes, which blocks carried the parent's lightest logicals>\n  FILLING: <how the cells are filled and why - which table facts it is meant to change>\n  DIFFERS FROM PARENT: <what the built matrices will contain that\n  the parent's do not>\nThe FIRST hunk must rewrite CONCEPT, GROUP, SHAPES and FILLING to match, and FAMILY_NAME\nwhenever the recorded identity changes - a new name on a group jump,\na new suffix when the labeling rule changes conceptually. A diff\nthat reproduces the parent's matrices costs a full measurement and\nreturns a number already known.\n\nREFUTED LEDGER: append-only comment ledger inside the EVOLVE block,\none line per hypothesis killed by measured evidence; never delete or\nrewrite existing lines.\n\n\"Author reasoning\" sections shown with programs are the authors' own\nclaims about why they made their choices - treat them as hypotheses,\nnot verified facts.\n\nRUN STATE (under the current program's artifacts, \"archive\") is the\nwhole run as it stands at the moment this prompt was built, not a\nfrozen record: BEDS lists every (group, shapes) bed any program of\nthis run has evaluated, with its best fitness, how many programs it\nholds and when it last improved - a bed absent from the list has\nnever been tried in this run; MOVES reports what the earlier\ngenerations' moves did, grouped by what they ACTUALLY changed\n(level 1 = same group and shapes as the parent, 2 = same group with\nnew shapes, 3 = new group), and lists the bed jumps with the child's\nscore against the destination bed's best at the time; FRONTIER shows the best program of every rate band (k/n 0.10 to\n0.55 in steps of 0.05, the MAP-Elites cells of this run) with its measured\ncodes and the cells of its best slot; SHAPES lists the shape\nfamilies the size law admits (per rate band the ones allowing the\nlargest lift order, plus every shape this run has used). These are\nmeasurements of this run; what to do with them is your decision.\n\nSIZE LIMIT: the whole program file must stay under 80000 characters; a longer program is rejected before it is built or scored and you get no feedback about it. Keep helper code compact.\n"
  max_artifact_bytes: 65536
